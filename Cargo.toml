[workspace]
resolver = "3"
members = [
    "crates/corvis",
    "crates/corvis-macros",
    "crates/corvis-cli",
    "crates/corvis-orm",
    "crates/corvis-orm-macros",
    "crates/corvis-swagger",
    "crates/corvis-swagger-macros",
    "examples/*",
    "bench/corvis-app",
    "bench/auth",

]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Randy Gil <r.gilcamejo@gmail.com>"]
repository = "https://github.com/randygil/corvis"
homepage = "https://corvis.randygil.com"
rust-version = "1.89"

[workspace.dependencies]
corvis = { path = "crates/corvis", version = "0.1.0" }
corvis-macros = { path = "crates/corvis-macros", version = "=0.1.0" }
corvis-orm-macros = { path = "crates/corvis-orm-macros", version = "=0.1.0" }
corvis-swagger-macros = { path = "crates/corvis-swagger-macros", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"

# Smaller and faster dev and test builds (the test profile inherits dev). Workspace crates keep line tables, so
# panics and backtraces still show file:line; dependencies carry no debug info. To step into a dependency with a
# debugger, comment out the package override. See CONTRIBUTING.md.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing with real parameters is memory-hard: without optimization the few tests that use the defaults take
# seconds instead of milliseconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
