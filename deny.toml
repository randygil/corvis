# Configuración de cargo-deny (`cargo deny check`): avisos de seguridad, licencias, crates
# vetados y orígenes de las dependencias. Se evalúa con todas las features activas.
[graph]
all-features = true

[advisories]
# Base de datos de RustSec. Las versiones retiradas (yanked) son un error; los crates sin
# mantenimiento o con avisos de "unsound" se reportan todos.
yanked = "deny"
unmaintained = "all"
unsound = "all"
# RUSTSEC-2023-0071 (`rsa`, ataque Marvin) no se ignora aquí: cargo-deny solo evalúa el grafo
# que realmente se compila y `rsa` no está en él (ver `.cargo/audit.toml`).
ignore = [
    # SQLite < 3.54.0 incluido por `sqlx-sqlite` 0.8; sin versión de `sqlx` con el arreglo.
    # Justificación completa en `.cargo/audit.toml`. Quitar con #155.
    { id = "RUSTSEC-2026-0459", reason = "no sqlx release accepts libsqlite3-sys >= 0.39; tracked in #155" },
]

[licenses]
# Licencias compatibles con un framework MIT que los usuarios incluyen en aplicaciones propias.
# Solo las que aparecen hoy en el grafo; una licencia nueva obliga a revisarla y agregarla.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Zlib", "Unicode-3.0", "BSL-1.0", "Unlicense", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Los ejemplos y el benchmark (`publish = false`) no se distribuyen: no necesitan licencia.
private = { ignore = true }

[bans]
multiple-versions = "warn"
# Versiones `*`: error. Las dependencias entre crates del workspace llevan `version` (en
# `[workspace.dependencies]`); las dependencias por `path` de los crates `publish = false` siguen
# permitidas por `allow-wildcard-paths`.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Criptografía de la autenticación (docs/security/authentication-threat-model.md, sección Dependencies):
# - ni OpenSSL ni TLS nativo: el cliente del proveedor OAuth2, la terminación TLS y la verificación de tokens
#   usan una sola pila revisada (rustls con ring);
# - una sola generación de cada crate que implementa una primitiva, un hash, un formato de token o TLS. Una
#   segunda versión (por ejemplo dos `subtle`) haría que dos comparaciones en tiempo constante o dos
#   implementaciones de SHA-2 convivieran en el mismo binario sin que nadie lo hubiera decidido. `rand_core` y
#   `getrandom` no están en la lista porque ya tienen más de una generación en el grafo, por dependencias que no
#   son de autenticación; el modelo de amenazas lo explica. `Cargo.lock` también trae `rand` 0.10, pero solo
#   desde `proptest` (pruebas), y `cargo deny` no lo cuenta.
deny = [
    { crate = "openssl", reason = "una sola pila TLS y criptográfica revisada (rustls con ring)" },
    { crate = "openssl-sys", reason = "una sola pila TLS y criptográfica revisada (rustls con ring)" },
    { crate = "native-tls", reason = "una sola pila TLS y criptográfica revisada (rustls con ring)" },
    { crate = "jsonwebtoken", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "ring", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "rustls", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "rustls-webpki", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "tokio-rustls", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "argon2", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "blake2", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "password-hash", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "bcrypt", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "blowfish", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "cipher", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "subtle", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "sha2", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "hmac", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "digest", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
    { crate = "rand", deny-multiple-versions = true, reason = "una generación de cada crate de autenticación" },
]

[sources]
# Solo crates.io: ni registros ni repositorios git desconocidos.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
