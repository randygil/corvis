# The definition-of-done checks of CONTRIBUTING.md, on every pull request to main or dev and on every push to main or
# dev.
#
# Work lands on dev, the integration branch, and reaches main through a pull request. main is protected: these jobs
# are required status checks, so changes reach main only through a pull request whose checks passed. Runs on main and
# dev also refresh the caches that pull requests to those branches can restore.
#
# Third-party actions are pinned to a full commit SHA (version in the comment); actions/* to a major version.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its run. Pushes to main and dev get a group per commit: a shared group
  # would still cancel a queued run when a third one arrives, and every commit there keeps its own result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The one place the Rust version is set. Bumping it is a deliberate pull request that fixes any new lints.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Each feature of corvis on its own
        shell: bash
        run: |
          cargo clippy -p corvis --no-default-features -- -D warnings
          for f in jwt websockets health-tls compression tls socket-io auth-local auth-api-key auth-session auth-oauth2; do
            cargo clippy -p corvis --no-default-features --features "$f" -- -D warnings
          done

  # Linux and Windows are separate jobs because service containers only run on Linux runners.
  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Same flags for build and test, so `cargo test` reuses the build's artifacts.
      RUSTFLAGS: -D warnings
      CORVIS_ORM_PG: postgres://postgres:postgres@127.0.0.1:55432
      # The Postgres tests fail instead of skipping when the service is not usable.
      CORVIS_ORM_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Build with warnings denied
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Test the compression feature
        run: cargo test -p corvis --features compression --no-fail-fast
      - name: Test the auth-local feature
        run: cargo test -p corvis --features auth-local --no-fail-fast
      - name: Test the auth-api-key feature
        run: cargo test -p corvis --features auth-api-key --no-fail-fast
      - name: Test the auth-session feature
        run: cargo test -p corvis --features auth-session --no-fail-fast
      - name: Test the auth-oauth2 feature
        run: cargo test -p corvis --features auth-oauth2 --no-fail-fast
      - name: Test the authentication review (all auth features together)
        run: cargo test -p corvis --features "auth-local auth-api-key auth-session auth-oauth2" --test auth_invariants --test auth_login_throttle --test auth_defaults --test auth_source_checks --test auth_guard_order_log --test auth_callback_timeouts --no-fail-fast
      - name: Test the socket-io feature
        run: cargo test -p corvis --features socket-io --no-fail-fast
      - name: Test the tls feature
        run: cargo test -p corvis --features tls --lib --test tls --test tls_ws --test tls_provider --no-fail-fast

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Build with warnings denied
        run: cargo build --workspace --all-targets
      - name: Test (Postgres tests skip, no server)
        run: cargo test --workspace --no-fail-fast
      - name: Test the tls feature
        run: cargo test -p corvis --features tls --lib --test tls --test tls_ws --test tls_provider --no-fail-fast

  # The property-based suites with more cases than the 2,000 that `cargo test` runs. Dev profile, so debug
  # assertions and overflow checks stay on.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROPTEST_CASES: 20000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Shared with the long run of nightly.yml, which builds the same test targets.
          shared-key: fuzz
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      # Every suite runs even when an earlier one failed, so one run reports all failing properties.
      - name: Parsers, JWT, routes, multipart
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis --lib fuzz
      - name: Engine.IO codec
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis --features socket-io --lib fuzz
      - name: API key extraction
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis --features auth-api-key --lib fuzz
      - name: Signed cookies and sessions
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis --features auth-session --lib fuzz
      - name: Authentication (gate model, sessions, OAuth2 callback, redirects, canary secrets)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis --features "auth-local auth-api-key auth-session auth-oauth2" --test fuzz_auth
      - name: Static file serving
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis --test fuzz_static
      - name: ORM where filters
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p corvis-orm --test fuzz_filters
      - name: Upload the proptest seeds
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      # Policy and exceptions live in deny.toml, each with a reason; no flags here.
      - run: cargo deny check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2
      # Reads .cargo/audit.toml (ignored advisories with their reasons, warnings denied); no flags here.
      - run: cargo audit

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Naming check of the published surfaces
        run: node scripts/check-naming.mjs
      - run: npm ci
        working-directory: docs
      - run: npm run docs:check
        working-directory: docs

  # Every published crate packages (license, notices, metadata, versioned dependencies). Cargo builds the packages
  # against a temporary registry, so crates that depend on each other verify before anything is on crates.io.
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Crate files and metadata
        run: node scripts/check-crate-files.mjs
      - name: Package the published crates
        run: cargo package -p corvis-macros -p corvis -p corvis-orm-macros -p corvis-orm -p corvis-swagger-macros -p corvis-swagger -p corvis-cli

  # Rustdoc with warnings denied: broken or private intra-doc links, invalid HTML tags, bare URLs. The CLI is
  # documented in its own step because its binary is named `corvis`, like the library: in one run both write
  # target/doc/corvis at the same time.
  doc:
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Document the workspace
        run: cargo doc --workspace --exclude corvis-cli --no-deps --all-features
      - name: Document the CLI
        run: cargo doc -p corvis-cli --no-deps --all-features

  # The minimum supported Rust version. The toolchain is read from `rust-version` in Cargo.toml, so the declaration
  # and the check cannot disagree. Library and binary targets of the published crates only: the promise is to users
  # of the crates, not to the test suites, which may use the toolchain of RUST_TOOLCHAIN.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: msrv
        name: Read rust-version from Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^rust-version = "\([0-9.]*\)"\r\{0,1\}$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then echo "::error file=Cargo.toml::no rust-version in [workspace.package]"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Check the published crates (default features)
        run: cargo check --locked -p corvis -p corvis-macros -p corvis-orm -p corvis-orm-macros -p corvis-swagger -p corvis-swagger-macros -p corvis-cli
      - name: Check the published crates (all features)
        run: cargo check --locked -p corvis -p corvis-macros -p corvis-orm -p corvis-orm-macros -p corvis-swagger -p corvis-swagger-macros -p corvis-cli --all-features

  # Each feature of corvis-orm and corvis-swagger on its own, with no default features and with all of them. The
  # features of corvis keep their loop in the clippy job, on Linux and Windows.
  features:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-hack@0.6.46
      - run: cargo hack check --each-feature --no-dev-deps -p corvis-orm -p corvis-swagger

  # Lint findings only go down: scripts/lint-ratchet.mjs counts the lints that still have findings against
  # lint-baseline.json (see CONTRIBUTING.md). No -D warnings here: the counted lints are warnings by design.
  lint-ratchet:
    name: lint-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Self-test of the script
        run: node scripts/lint-ratchet.mjs --self-test
      - name: Compare with lint-baseline.json
        run: node scripts/lint-ratchet.mjs

  # Public API changes against the merge base with main, written to the job summary. Informational, NOT a required
  # check: before the first release to crates.io, public API that must change changes now; this job makes it visible.
  # After that release it becomes required, with the published version as the baseline.
  semver:
    name: semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge base with main has to be in the clone.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Compare the public API with the merge base of main
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          set +e
          cargo semver-checks --workspace --baseline-rev "$base" --color never 2>&1 | tee semver.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Public API against the merge base with main (\`$base\`)"
            echo
            echo '```'
            cat semver.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
