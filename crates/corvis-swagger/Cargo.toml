[package]
name = "corvis-swagger"
description = "OpenAPI (Swagger) module for Corvis: document generator, decorators, zod DTO support, Swagger UI and the Scalar API reference."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["openapi", "swagger", "zod", "corvis"]
categories = ["web-programming::http-server"]

[dependencies]
corvis = { workspace = true }
corvis-swagger-macros = { path = "../corvis-swagger-macros", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"

[dev-dependencies]
tokio = { workspace = true }
