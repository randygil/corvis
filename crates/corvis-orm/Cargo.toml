[package]
name = "corvis-orm"
description = "ORM for Corvis: models with #[derive(Model)], JSON query arguments, db push, migrations compatible with schema.prisma projects and an OrmModule/OrmService integration."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories = ["database", "asynchronous"]
readme = "README.md"
keywords = ["orm", "sqlx", "corvis", "database", "postgres"]

[lints]
workspace = true

[features]
default = ["corvis", "tls-rustls"]
# OrmModule / OrmService / OrmExceptionFilter and logging through the corvis logger.
corvis = ["dep:corvis"]
# TLS for Postgres connections (`sslmode=require` / `verify-ca` / `verify-full`), with rustls and
# the Mozilla root certificates. Disable default features to build without TLS.
tls-rustls = ["sqlx/tls-rustls"]

[dependencies]
corvis = { workspace = true, optional = true }
corvis-orm-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
num_cpus = "1"
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json", "uuid"] }

[dev-dependencies]
proptest = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }

[[test]]
name = "corvis_module"
required-features = ["corvis"]
