[package]
name = "corvis"
description = "A modular backend framework for Rust: modules, dependency injection, controllers, guards, interceptors, pipes, exception filters, middleware and WebSockets."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["web", "framework", "http", "dependency-injection"]
categories = ["web-programming::http-server", "asynchronous"]

[lints]
workspace = true

[dependencies]
corvis-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = "2"
futures = { workspace = true }
bytes = "1"
http = "1"
http-body-util = "0.1"
h2 = "0.4"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio", "http1", "http2"] }
matchit = "0.8"
form_urlencoded = "1"
percent-encoding = "2"
chrono = { workspace = true }
regex = { workspace = true }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
indexmap = "2"
jsonwebtoken = { version = "9", optional = true }
tokio-tungstenite = { workspace = true, optional = true }
base64 = "0.22"
fancy-regex = "0.20"
url = "2"
unicode-normalization = "0.1"
rand = "0.8"
sha1 = "0.10"
sha2 = { workspace = true }
memchr = "2"
memory-stats = "1"
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "0.26", optional = true }
flate2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
argon2 = { version = "0.5", optional = true }
bcrypt = { version = "0.17", optional = true }
subtle = { version = "2", optional = true }
hmac = { version = "0.12", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[features]
default = ["jwt", "websockets"]
jwt = ["dep:jsonwebtoken"]
websockets = ["dep:tokio-tungstenite"]
socket-io = ["websockets"]
tls = ["dep:tokio-rustls"]
health-tls = ["dep:tokio-rustls", "dep:webpki-roots"]
compression = ["dep:flate2", "dep:brotli"]
auth-local = ["dep:argon2", "dep:bcrypt"]
auth-api-key = ["dep:subtle"]
auth-session = ["dep:hmac", "dep:subtle"]
auth-oauth2 = ["auth-session", "dep:tokio-rustls", "dep:webpki-roots"]

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde = { workspace = true }
# `raw_value` is what sqlx turns on in an app with the ORM; the JWT header tests need it on (dev builds only).
serde_json = { workspace = true, features = ["raw_value"] }
tokio-tungstenite = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
flate2 = { workspace = true }
brotli = { workspace = true }
