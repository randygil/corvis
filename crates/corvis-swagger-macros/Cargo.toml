[package]
name = "corvis-swagger-macros"
description = "Procedural macros (Api* decorators and #[derive(ApiSchema)]) for corvis-swagger."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
