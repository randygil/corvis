[package]
name = "corvis-sio-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Socket.IO benchmark of Corvis: a server with a counting allocator and a raw load generator."

[dependencies]
corvis = { workspace = true, features = ["socket-io"] }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
memory-stats = "1"
tokio-tungstenite = { workspace = true }

[[bin]]
name = "corvis-sio-bench"
path = "src/main.rs"
